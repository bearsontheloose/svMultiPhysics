name: Ubuntu runner and container OS probe

on:
  push:
    branches:
      - feature/734-test-ubuntu-26
    paths:
      - .github/workflows/ubuntu-26-container-probe.yml

permissions: {}

jobs:
  report-runner-os:
    name: Report ubuntu-latest runner OS
    runs-on: ubuntu-latest
    steps:
      - name: Show runner OS, architecture, and kernel
        run: |
          cat /etc/os-release
          uname -m
          uname -r

  report-container-os:
    name: Report Ubuntu container OS
    runs-on: ubuntu-latest
    container: simvascular/libraries:latest
    steps:
      - name: Show container OS and architecture
        run: |
          cat /etc/os-release
          uname -m
