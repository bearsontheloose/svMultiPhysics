name: Promote validated dependency image on fork

on:
  push:
    branches:
      - test/766-promotion-probe

permissions: {}

jobs:
  promote:
    if: github.repository == 'bearsontheloose/svMultiPhysics'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/bearsontheloose/svmultiphysics-dependencies
      SOURCE_DIGEST: sha256:500048fdad3f0177557a92ab4984b805741240bdcf4b81f8409b7dad470a45cd
      SOURCE_COMMIT: 8acd5a922031424e7d0bb7be39f0d56daa7ef40d
      PROBE_COMMIT: ef7315472150b4f83c25538048cd9ec77afdac54
      IMAGE_TAG: 1.0.0.1-dev
      GIT_TAG: v1.0.0.1-dev
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source and tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$PROBE_COMMIT"
          [[ "$(git rev-parse origin/main)" == "$SOURCE_COMMIT" ]] || {
            echo 'Fork main no longer matches the selected upstream commit' >&2
            exit 1
          }
          [[ "$(git rev-parse "$SOURCE_COMMIT:Docker/ubuntu")" == "$(git rev-parse "$PROBE_COMMIT:Docker/ubuntu")" ]] || {
            echo 'The tested and release Docker contexts differ' >&2
            exit 1
          }
          existing=$(git ls-remote --refs --tags origin "refs/tags/$GIT_TAG" | awk '{ print $1 }')
          if [[ -n "$existing" && "$existing" != "$SOURCE_COMMIT" ]]; then
            echo "$GIT_TAG already points to $existing" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote and verify without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          inspect_digest() {
            local digest
            for attempt in {1..8}; do
              if digest=$(docker buildx imagetools inspect "$1" 2>/dev/null | awk '$1 == "Digest:" { print $2; exit }') &&
                 [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                printf '%s\n' "$digest"
                return 0
              fi
              sleep 3
            done
            echo "Could not resolve digest for $1 after 8 attempts" >&2
            return 1
          }

          [[ "$(inspect_digest "$IMAGE@$SOURCE_DIGEST")" == "$SOURCE_DIGEST" ]]
          if docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" > /dev/null 2>&1; then
            actual=$(inspect_digest "$IMAGE:$IMAGE_TAG")
            [[ "$actual" == "$SOURCE_DIGEST" ]] || {
              echo "$IMAGE:$IMAGE_TAG already points to $actual" >&2
              exit 1
            }
          else
            docker buildx imagetools create --prefer-index=false \
              --tag "$IMAGE:$IMAGE_TAG" "$IMAGE@$SOURCE_DIGEST"
          fi
          [[ "$(inspect_digest "$IMAGE:$IMAGE_TAG")" == "$SOURCE_DIGEST" ]] || {
            echo 'Promoted image digest differs from the validated image' >&2
            exit 1
          }

      - name: Tag the corresponding fork commit
        shell: bash
        run: |
          set -euo pipefail
          existing=$(git ls-remote --refs --tags origin "refs/tags/$GIT_TAG" | awk '{ print $1 }')
          if [[ -n "$existing" ]]; then
            [[ "$existing" == "$SOURCE_COMMIT" ]] || exit 1
          else
            git tag "$GIT_TAG" "$SOURCE_COMMIT"
            git push origin "refs/tags/$GIT_TAG"
          fi
          printf 'Promoted `%s@%s` to `%s:%s` without rebuilding.\n' \
            "$IMAGE" "$SOURCE_DIGEST" "$IMAGE" "$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
          printf 'Fork Git tag `%s` points to `%s`. The image revision label names the tested probe commit `%s`; the Docker build context is identical.\n' \
            "$GIT_TAG" "$SOURCE_COMMIT" "$PROBE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
